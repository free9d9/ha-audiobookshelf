continue_listening:
  fields:
    entity_id:
      required: true
      example: media_player.kitchen_speaker
      selector:
        entity:
          filter:
            # PAUSE weeds out talkback and notification speakers, which offer
            # PLAY_MEDIA + STOP and nothing else. Unlike SEEK, it is advertised
            # while the player is idle, so the picker can rely on it.
            - domain: media_player
              supported_features:
                - media_player.MediaPlayerEntityFeature.PLAY_MEDIA
                - media_player.MediaPlayerEntityFeature.PAUSE
    user:
      required: false
      example: Brian
      selector:
        text:
    seek:
      required: false
      default: true
      selector:
        boolean:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: audiobookshelf_plus

remove_progress:
  fields:
    user:
      required: false
      example: Brian
      selector:
        text:
    series:
      required: false
      example: Mistborn
      selector:
        text:
    item_id:
      required: false
      example: 7a46ad79-85af-43c9-9e81-1472909463e0
      selector:
        text:
    config_entry:
      required: false
      selector:
        config_entry:
          integration: audiobookshelf_plus

get_year_in_review:
  fields:
    user:
      required: false
      example: Brian
      selector:
        text:
    year:
      required: false
      example: 2026
      selector:
        number:
          min: 2000
          max: 9999
          mode: box
    config_entry:
      required: false
      selector:
        config_entry:
          integration: audiobookshelf_plus
